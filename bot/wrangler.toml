name = "snowfinder-bot"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Close expired votes every 15 minutes.
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "snowfinder-bot"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

[vars]
TIMEZONE = "Europe/Lisbon"
SITE_URL = ""
ALLOWED_CHATS = ""
# Secrets (not here): npx wrangler secret put BOT_TOKEN · npx wrangler secret put WEBHOOK_SECRET
