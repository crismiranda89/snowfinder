<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Snowtinder</title>
<meta name="description" content="Not a skier? Swipe through spas, sleigh rides, huskies and snowy villages, and find the snow holiday that's yours.">
<meta name="theme-color" content="#f6e9ef">
<meta property="og:type" content="website">
<meta property="og:title" content="Snowtinder 🔥">
<meta property="og:description" content="Not a skier? Swipe the photos you love and find your snow holiday.">
<meta property="og:image" content="%SITE_URL%og.png">
<meta property="og:url" content="%SITE_URL%vibe.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{--bg:#fff3ea;--bg2:#f3eee4;--ink:#242c30;--muted:#766f6b;--card:#fffdf9;--love:#e45e45;--nope:#8c8496;--star:#e9a12c;--line:#eadbd0;--accent:#e45e45}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);background:linear-gradient(170deg,var(--bg),var(--bg2));min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
main{max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
h1,h2{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;margin:0;line-height:1.04;letter-spacing:-.045em}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.top b{font-family:"Space Grotesk",system-ui,sans-serif;font-size:1.15rem}
.top small{color:var(--muted);font-size:.85rem}
.bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;width:0;background:var(--love);transition:width .3s}
.btn{appearance:none;border:0;border-radius:999px;padding:14px 22px;font:600 1rem "DM Sans",sans-serif;background:var(--love);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:active{transform:scale(.97)}
/* Intro */
.intro{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center}
.intro h1{font-size:2.7rem}.intro h1 em{color:var(--love);font-style:normal}
.intro p{color:var(--muted);font-size:1.05rem;margin:0;line-height:1.5;max-width:390px;align-self:center}
.intro-kicker{font-size:.74rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#a6533e;margin-top:4px}
.round-count{font-size:.82rem!important;color:#8b8079!important;letter-spacing:.02em}
.peek{display:flex;justify-content:center;margin:6px 0 4px}.peek img{width:92px;height:122px;object-fit:cover;border-radius:16px;border:3px solid var(--card);box-shadow:0 8px 24px #0002;margin:0 -14px}
.peek img:nth-child(1){transform:rotate(-9deg)}.peek img:nth-child(3){transform:rotate(9deg)}.peek img:nth-child(2){position:relative;z-index:1;transform:translateY(-8px)}
.how{display:flex;justify-content:center;gap:18px;font-size:.9rem;color:var(--muted)}
/* Deck */
.deck{position:relative;flex:1;min-height:420px;max-height:640px}
.card{position:absolute;inset:0;border-radius:24px;overflow:hidden;background:var(--card);box-shadow:0 14px 40px #2a223033;touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform}
.card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.card .shade{position:absolute;inset:auto 0 0 0;padding:70px 18px 18px;background:linear-gradient(transparent,#000c);color:#fff}
.card h2{font-size:1.6rem;margin-bottom:4px;letter-spacing:-.025em}
.card .sub{font-size:.95rem;opacity:.92}
.card .kid{position:absolute;top:14px;left:14px;background:#fffe;color:#2a2230;font-size:.8rem;font-weight:700;padding:5px 10px;border-radius:999px}
.card .cred{position:absolute;top:14px;right:14px;font-size:.65rem;color:#fffd;background:#0005;padding:3px 7px;border-radius:8px;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .stamp{position:absolute;top:56px;font:700 1.7rem "DM Sans",sans-serif;padding:4px 12px;border:4px solid;border-radius:12px;opacity:0;letter-spacing:.04em}
.card .stamp.yes{left:20px;color:#3ccf7a;transform:rotate(-14deg)}.card .stamp.no{right:20px;color:#ff5d6c;transform:rotate(14deg)}
.card.behind{transform:scale(.95) translateY(12px);filter:brightness(.92)}
.acts{display:flex;justify-content:center;align-items:center;gap:20px;padding:16px 0 4px}
.round{width:64px;height:64px;border-radius:50%;border:0;background:var(--card);box-shadow:0 6px 18px #2a223026;font-size:1.7rem;cursor:pointer;display:grid;place-items:center}
.round.small{width:50px;height:50px;font-size:1.3rem}
.round:active{transform:scale(.92)}
/* Result */
.result{display:flex;flex-direction:column;gap:14px}
.hero{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:4/5;box-shadow:0 14px 40px #2a223033}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .shade{position:absolute;inset:auto 0 0 0;padding:90px 20px 20px;background:linear-gradient(transparent,#000d);color:#fff}
.hero .eyebrow{font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.hero h1{font-size:2.6rem;margin:4px 0}
.hero .match{font-size:1.05rem}
.why{background:var(--card);border-radius:18px;padding:14px 16px}
.why b{display:block;margin-bottom:6px}
.why ul{margin:0;padding-left:1.1em;line-height:1.5}
.others{display:grid;gap:8px}
.other{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:14px;padding:10px 14px}
.other .m{height:6px;border-radius:9px;background:var(--line);flex:1;margin:0 12px;overflow:hidden}.other .m i{display:block;height:100%;background:var(--love)}
.stack{display:grid;gap:10px}
.credits{font-size:.72rem;color:var(--muted);line-height:1.5;margin-top:6px}.credits a{color:inherit}
.empty{color:var(--muted);text-align:center}
/* Landing A: one full-bleed photo with the copy over it */
body[data-look="a"] main{padding:0;max-width:none}
.look-a{position:relative;min-height:100dvh;justify-content:flex-end;text-align:left;gap:0}
.look-a .bleed{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.look-a .bleed-copy{position:relative;display:grid;gap:14px;padding:120px max(20px,env(safe-area-inset-left)) max(28px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#000000d9 45%);color:#fff;max-width:520px}
.look-a h1{font-size:3rem;color:#fff}.look-a p{color:#fffd;align-self:auto}.look-a .intro-kicker{color:#ffd2c4}.look-a .round-count{color:#fffb!important}
.look-a{overflow:hidden}
.look-a .bleed{transform:scale(1.14);animation:nudge 4s ease-in-out infinite}
.lstamp{position:absolute;top:18%;z-index:1;font:700 2.2rem "DM Sans",sans-serif;padding:4px 14px;border:5px solid;border-radius:14px;letter-spacing:.04em;opacity:0}
.lstamp.yes{left:24px;color:#3ccf7a;transform:rotate(-14deg);animation:stampyes 4s ease-in-out infinite}
.lstamp.no{right:24px;color:#ff5d6c;transform:rotate(14deg);animation:stampno 4s ease-in-out infinite}
.swipehint{display:flex;align-items:center;justify-content:space-between;background:#ffffff26;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid #fff5;border-radius:999px;padding:9px 16px;font-weight:700;font-size:.95rem}
.swipehint i{font-style:normal;font-size:1.6rem;animation:hand 4s ease-in-out infinite}
.look-a .hinttext{font-size:.88rem;margin-top:-6px}
@keyframes nudge{0%,12%,50%,62%,100%{transform:scale(1.14) translateX(0) rotate(0)}28%,34%{transform:scale(1.14) translateX(3%) rotate(1deg)}78%,84%{transform:scale(1.14) translateX(-3%) rotate(-1deg)}}
@keyframes stampyes{0%,16%,42%,100%{opacity:0}26%,36%{opacity:1}}
@keyframes stampno{0%,66%,92%,100%{opacity:0}76%,86%{opacity:1}}
@keyframes hand{0%,12%,50%,62%,100%{transform:translateX(0) rotate(0)}28%,34%{transform:translateX(70px) rotate(15deg)}78%,84%{transform:translateX(-70px) rotate(-15deg)}}
/* Landing B: a teaser deck that swipes itself */
.look-b .tease{position:relative;height:330px;width:230px;align-self:center}
.tcard{position:absolute;inset:0;border-radius:20px;overflow:hidden;box-shadow:0 14px 34px #2a223040;background:var(--card);transition:transform .6s ease-in,opacity .6s}
.tcard img{width:100%;height:100%;object-fit:cover}
.tcard b{position:absolute;inset:auto 0 0 0;padding:40px 12px 12px;background:linear-gradient(transparent,#000c);color:#fff;font-size:.95rem;text-align:left}
.tcard .stamp{position:absolute;top:22px;font:700 1.2rem "DM Sans",sans-serif;padding:3px 9px;border:3px solid;border-radius:10px;opacity:0}
.tcard .stamp.yes{left:14px;color:#3ccf7a;transform:rotate(-14deg)}.tcard .stamp.no{right:14px;color:#ff5d6c;transform:rotate(14deg)}
.tcard.out-yes{transform:translate(150%,-4%) rotate(24deg);opacity:0}.tcard.out-yes .stamp.yes{opacity:1}
.tcard.out-no{transform:translate(-150%,-4%) rotate(-24deg);opacity:0}.tcard.out-no .stamp.no{opacity:1}
/* Landing C: a mosaic of questions */
.mosaic{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mosaic figure{margin:0;position:relative;border-radius:16px;overflow:hidden;aspect-ratio:3/4}
.mosaic figure:nth-child(2),.mosaic figure:nth-child(5){transform:translateY(14px)}
.mosaic img{width:100%;height:100%;object-fit:cover}
.mosaic figcaption{position:absolute;left:8px;bottom:8px;background:#fffffff0;color:var(--ink);font-weight:700;font-size:.8rem;padding:4px 9px;border-radius:999px}
.look-c h1{margin-top:12px}
/* Landing D: a postcard */
.postcard{position:relative;align-self:center;width:min(86%,330px);background:#fff;padding:12px 12px 46px;border-radius:6px;box-shadow:0 18px 40px #2a223038;transform:rotate(-3deg)}
.postcard img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:3px;display:block}
.postcard .hand{position:absolute;left:16px;bottom:10px;font:600 1.45rem "Caveat",cursive;color:#2a2230}
.postcard .stampbox{position:absolute;top:-14px;right:-12px;width:58px;height:66px;background:var(--love);color:#fff;display:grid;place-items:center;font-size:1.8rem;border:4px dashed #fff;border-radius:4px;transform:rotate(8deg);box-shadow:0 6px 14px #0003}
@media (max-width:380px){.intro h1{font-size:2.35rem}.peek img{width:82px;height:112px}.look-a h1{font-size:2.5rem}.look-b .tease{height:290px;width:200px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script type="module" src="vibe.js"></script>
</body>
</html>
