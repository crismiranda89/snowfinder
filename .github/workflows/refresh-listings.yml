# Weekly (and on demand): rebuild the house listings from data/listings.csv and the optional Google Sheet,
# commit the result if it changed, then redeploy the site.
name: Refresh house listings
on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pytest -q
      - run: python -m pipeline.build_listings
        env:
          LISTINGS_SHEET_URL: ${{ secrets.LISTINGS_SHEET_URL }}
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/generated/listings.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/listings.json
          git commit -m "Refresh house listings"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Pushes made with the workflow token don't trigger other workflows, so start the deploy explicitly.
      - if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
